<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Response Preferences — the reply format in use</title>
  <desc id="description">An example chat showing magenta skill names, a quoted question, a direct answer, underlined scanning clues, green success, cyan information, orange caution, red critical text and a lavender closing topic reminder. The outcomes are examples, not real task results.</desc>
  <rect x="1" y="1" width="898" height="538" rx="16" fill="#101010" stroke="#363636"/>
  <path d="M1 51H899" stroke="#303030"/>
  <circle cx="25" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="26" r="6" fill="#febc2e"/>
  <circle cx="65" cy="26" r="6" fill="#28c840"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#dedede">
    <text x="91" y="32" font-size="15" fill="#aaa">Response Preferences / Example conversation</text>
    <rect x="409" y="76" width="458" height="46" rx="20" fill="#202020"/>
    <text x="431" y="105">What does this skill do to your replies?</text>
    <text x="33" y="159" font-size="17">🧠 Skill use: <tspan fill="#ff00ff" font-family="Georgia, Times New Roman, serif">response-preferences</tspan><tspan fill="#b8b1df"> ↗</tspan></text>
    <path d="M34 187V214" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="207">What does this skill do to your replies?</text>
    <text x="32" y="259" font-size="38">⮑</text>
    <text x="78" y="254" font-size="29">👉</text>
    <text x="120" y="253"><tspan text-decoration="underline">Response Preferences</tspan> gives replies a consistent visual format:</text>
    <text x="33" y="285">markers, colours, <tspan text-decoration="underline">underlined clues</tspan> and a closing topic line.</text>
    <text x="33" y="331" font-size="27">✅</text>
    <text x="76" y="328" fill="#22c55e"><tspan text-decoration="underline">The example export</tspan> <tspan text-decoration="underline">finished with no errors.</tspan></text>
    <text x="33" y="370" font-size="30">ⓘ</text>
    <text x="76" y="367" fill="#67e8f9"><tspan text-decoration="underline">This viewer</tspan> is a <tspan text-decoration="underline">snapshot</tspan> of the file.</text>
    <text x="33" y="409" font-size="27">⚠️</text>
    <text x="76" y="406" fill="#fb923c"><tspan text-decoration="underline">The sample build</tspan> is <tspan text-decoration="underline">still pending review.</tspan></text>
    <text x="33" y="448" font-size="27">⚠️</text>
    <text x="76" y="445" fill="#ef4444"><tspan text-decoration="underline">Save the project</tspan> before restarting.</text>
    <text x="33" y="484" font-size="15" fill="#8d8d8d">Example sentences only, not real results. Click this preview to explore the full format.</text>
    <text x="33" y="515" fill="#b8a4d9">About: what Response Preferences changes in your replies.</text>
  </g>
</svg>
